name: Release with SignPath Signing

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Build app
        run: |
          npm run typecheck
          npm run build

      - name: Package for Windows
        run: npx electron-builder --win --publish never

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: pulse-win-unsigned
          path: |
            dist/Pulse-Setup-*.exe
            dist/Pulse-Setup-*.exe.blockmap
            dist/Pulse-Portable-*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Build app
        run: |
          npm run typecheck
          npm run build

      - name: Package for Linux
        run: npx electron-builder --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pulse-linux
          path: |
            dist/Pulse-*.AppImage
            dist/Pulse-*.deb
          if-no-files-found: error

  sign-windows:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download unsigned artifact
        uses: actions/download-artifact@v4
        with:
          name: pulse-win-unsigned
          path: unsigned

      - name: Upload unsigned to SignPath
        id: upload-signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          # Parameters can be passed to artifact configuration if needed
          parameters: |
            version: ${{ github.ref_name }}

  release:
    needs: [build-windows, build-linux, sign-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: pulse-win-signed
          path: artifacts/win

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: pulse-linux
          path: artifacts/linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/win/*
            artifacts/linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
