<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pulse</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <img class="logo" src="icons/icon48.png" alt="" />
      <div class="brand">
        <strong>Pulse</strong>
        <span id="version" class="version"></span>
      </div>
      <span id="status" class="status">
        <span class="dot"></span>
        <span id="status-text" data-i18n="statusConnecting">Connecting</span>
      </span>
    </header>

    <div id="offline" class="offline hidden">
      <p data-i18n="offlineHint"></p>
      <div class="row">
        <button id="retry" class="btn ghost" type="button" data-i18n="statusRetry">Retry</button>
        <button id="open-pulse-offline" class="btn primary" type="button" data-i18n="openPulse">
          Open Pulse
        </button>
      </div>
    </div>

    <section class="card">
      <div class="label" data-i18n="currentPage">Current page</div>
      <div id="tab-title" class="tab-title"></div>
      <div id="tab-url" class="tab-url"></div>
      <button id="send-page" class="btn primary full" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 16V4m0 0L7 9m5-5 5 5M5 20h14" />
        </svg>
        <span data-i18n="sendPage">Send page</span>
      </button>
    </section>

    <section class="card">
      <div class="label" data-i18n="addLink">Add a link</div>
      <div class="row">
        <input
          id="url"
          class="input"
          type="url"
          dir="ltr"
          spellcheck="false"
          autocomplete="off"
          data-i18n-placeholder="urlPlaceholder"
          placeholder="https://example.com/file.zip"
        />
        <button id="add" class="btn primary" type="button" data-i18n="download">Download</button>
      </div>
    </section>

    <section class="downloads">
      <div class="section-head">
        <span data-i18n="active">Active</span>
        <span id="speed" class="speed"></span>
      </div>
      <div id="task-list" class="task-list"></div>
      <div id="empty" class="empty" data-i18n="noActive">No active downloads</div>
    </section>

    <footer class="footer">
      <label class="toggle">
        <input id="takeover" type="checkbox" />
        <span class="switch" aria-hidden="true"></span>
        <span data-i18n="takeover">Take over browser downloads</span>
      </label>
      <div class="footer-actions">
        <button id="settings" class="icon-btn" type="button" data-i18n-title="settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.14.37.36.7.66.97.3.27.68.42 1.08.43H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.6Z" />
          </svg>
        </button>
        <button id="open-pulse" class="btn ghost" type="button" data-i18n="openPulse">Open Pulse</button>
      </div>
    </footer>

    <div id="toast" class="toast hidden"></div>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
